services:
  shortdrama-agent:
    build: .
    restart: unless-stopped
    env_file:
      - .env.cloud
    ports:
      - "8000:8000"
    volumes:
      - shortdrama-agent-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  shortdrama-agent-data:

