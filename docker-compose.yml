services:
  shortdrama-agent:
    build: .
    ports:
      - "8000:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      SHORTDRAMA_DATA_DIR: /data
      SHORTDRAMA_DEPLOYMENT_MODE: local
      PUBLIC_BASE_URL: http://127.0.0.1:8000
    volumes:
      - shortdrama-agent-data:/data

volumes:
  shortdrama-agent-data:
