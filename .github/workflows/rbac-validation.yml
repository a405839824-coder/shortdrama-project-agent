name: Account access validation

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'skills/**'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rbac-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Main smoke validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: bash scripts/setup_local.sh

      - name: Verify rules, runtime and transports
        env:
          PYTHONPATH: server
          PYTHONUTF8: '1'
        run: |
          .venv/bin/python skills/shortdrama-storyboard/scripts/rule_registry.py --check
          .venv/bin/python skills/shortdrama-storyboard/scripts/r10_bootstrap.py --self-test
          .venv/bin/python server/main.py --self-test
          .venv/bin/python tests/stdio_smoke.py
          .venv/bin/python tests/http_smoke.py
